<h2>Stock List</h2>

<div>
  <div>
    <input
    type="text"
    placeholder="Find Stock by Code"
    [(ngModel)]="searchCode"
  />
  <p>Search Code: {{ searchCode }}</p>
  </div>
  @if (stocks$ | async; as stocks) {
    @if (filteredStocks(stocks).length > 0) {
      @for (stock of filteredStocks(stocks); track stock.code) {
        <app-stock-item [stock]="stock"></app-stock-item>
      }
    } @else {
      <p>No stocks available.</p>
    }
  }
</div>
